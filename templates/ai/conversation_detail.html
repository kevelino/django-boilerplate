{% extends 'web/base.html' %}
{% block body %}
<div class="container mx-auto p-6 max-w-2xl">
  <h1 class="text-2xl font-bold mb-4">{{ conversation.title }}</h1>
  <div id="messages" class="space-y-3 mb-4">
    {% include 'ai/_messages.html' %}
  </div>
  <form method="post" action="{% url 'send_message' conversation.pk %}" hx-post="{% url 'send_message' conversation.pk %}" hx-target="#messages" hx-swap="innerHTML">
    {% csrf_token %}
    <textarea name="content" class="textarea textarea-bordered w-full" rows="3" required></textarea>
    <button class="btn btn-primary mt-2" type="submit">Send</button>
  </form>
</div>
{% endblock %}
